<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Plotter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ──────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #242836;
      --border: #2e3348;
      --text: #e4e6f0;
      --text-dim: #8b90a5;
      --accent: #6c8cff;
      --accent-hover: #8aa3ff;
      --accent-glow: rgba(108, 140, 255, .25);
      --danger: #ff6b6b;
      --success: #51cf66;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #242836 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header svg {
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .header p {
      font-size: .82rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── Layout ────────────────────────────────────────── */
    .app {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    .sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .main {
      flex: 1;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-y: auto;
    }

    /* ── Section Cards ─────────────────────────────────── */
    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
    }

    .card-title {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* ── File Upload ───────────────────────────────────── */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .dropzone input {
      display: none;
    }

    .dropzone p {
      font-size: .85rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .dropzone .icon {
      font-size: 1.8rem;
    }

    .file-badge {
      margin-top: 10px;
      font-size: .8rem;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Form Elements ─────────────────────────────────── */
    label.field-label {
      display: block;
      font-size: .78rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    select,
    input[type="text"],
    input[type="number"],
    input[type="datetime-local"],
    input[type="color"] {
      width: 100%;
      padding: 9px 12px;
      font-size: .85rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      transition: border-color .2s;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    select option {
      background: var(--bg);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row>* {
      flex: 1;
    }

    .field {
      margin-bottom: 12px;
    }

    /* ── Checkbox ───────────────────────────────────────── */
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .83rem;
      margin-bottom: 8px;
    }

    .check-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 12px;
      font-size: .9rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, transform .1s, box-shadow .2s;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* ── Plot Area ──────────────────────────────────────── */
    .plot-area {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .plot-placeholder {
      width: 100%;
      min-height: 400px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 10px;
    }

    .plot-placeholder .ph-icon {
      font-size: 2.5rem;
      opacity: .5;
    }

    .plot-img {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
    }

    .plot-interactive {
      width: 100%;
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
      padding: 12px;
    }

    /* ── Spinner ────────────────────────────────────────── */
    .spinner {
      display: none;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--danger);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .3s, transform .3s;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 820px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>

  <!-- ─── Header ──────────────────────────────────────────── -->
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
    </svg>
    <div>
      <h1>Data Plotter</h1>
      <p>Upload &middot; Select Columns &middot; Set Range &middot; Plot</p>
    </div>
  </div>

  <div class="app">

    <!-- ─── Sidebar ─────────────────────────────────────── -->
    <aside class="sidebar">

      <!-- File Upload -->
      <div class="card">
        <div class="card-title">1 &mdash; Upload File</div>
        <div class="dropzone" id="dropzone">
          <div class="icon">📂</div>
          <p>Click or drag a <strong>CSV / Excel</strong> file</p>
          <input type="file" id="fileInput" accept=".csv,.xls,.xlsx" />
        </div>
        <div class="file-badge" id="fileBadge" style="display:none;">
          <span>✓</span> <span id="fileName"></span> — <span id="fileRows"></span> rows
        </div>
      </div>

      <!-- Column Selection -->
      <div class="card" id="colCard" style="opacity:.4;pointer-events:none;">
        <div class="card-title">2 &mdash; Select Columns</div>
        <div class="field">
          <label class="field-label" for="xCol">X Axis</label>
          <select id="xCol">
            <option value="">— select —</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="yCol">Y Axis</label>
          <select id="yCol">
            <option value="">— select —</option>
          </select>
        </div>
      </div>

      <!-- Range -->
      <div class="card" id="rangeCard" style="opacity:.4;pointer-events:none;">
        <div class="card-title">3 &mdash; X-Axis Range <span
            style="font-weight:400;text-transform:none;">(optional)</span></div>
        <div class="field">
          <label class="field-label" for="xMin">From</label>
          <input type="text" id="xMin" placeholder="auto" />
        </div>
        <div class="field">
          <label class="field-label" for="xMax">To</label>
          <input type="text" id="xMax" placeholder="auto" />
        </div>
        <p id="rangeHint" style="font-size:.75rem;color:var(--text-dim);margin-top:2px;"></p>
      </div>

      <!-- Plot Options -->
      <div class="card" id="optCard" style="opacity:.4;pointer-events:none;">
        <div class="card-title">4 &mdash; Plot Options</div>
        <div class="field">
          <label class="field-label" for="plotTitle">Title</label>
          <input type="text" id="plotTitle" placeholder="Auto-generated" />
        </div>
        <div class="row field">
          <div>
            <label class="field-label" for="xLabel">X-Axis Label</label>
            <input type="text" id="xLabel" placeholder="Default (X column)" />
          </div>
          <div>
            <label class="field-label" for="yLabel">Y-Axis Label</label>
            <input type="text" id="yLabel" placeholder="Default (Y column)" />
          </div>
        </div>
        <div class="row field">
          <div>
            <label class="field-label" for="lineColor">Line Color</label>
            <input type="color" id="lineColor" value="#6c8cff" />
          </div>
          <div>
            <label class="field-label" for="lineWidth">Line Width</label>
            <input type="number" id="lineWidth" value="2" min="0.5" max="8" step="0.5" />
          </div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="showGrid" checked /> <label for="showGrid">Show Grid</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="showLegend" checked /> <label for="showLegend">Show Legend</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="showMarkers" /> <label for="showMarkers">Show Markers</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="showAnnotations" /> <label for="showAnnotations">Annotate Points
            (Time/Index)</label>
        </div>
        <div class="field" id="markerSizeWrap" style="display:none;">
          <label class="field-label" for="markerSize">Marker Size</label>
          <input type="number" id="markerSize" value="5" min="1" max="15" step="1" />
        </div>
        <div class="field" id="specIdxWrap" style="display:none;">
          <label class="field-label" for="specifiedIndices">Show Only at Indices <span
              style="font-weight:400;text-transform:none;">(1-based, comma separated)</span></label>
          <input type="text" id="specifiedIndices" placeholder="e.g. 1, 5, 18, 21" />
        </div>
        <div id="annConfigWrap" style="display:none;">
          <div class="row field">
            <div>
              <label class="field-label" for="annFontsize">Text Size</label>
              <input type="number" id="annFontsize" value="10" min="6" max="24" step="1" />
            </div>
            <div>
              <label class="field-label" for="annOffset">Distance <span
                  style="text-transform:none;">(Offset)</span></label>
              <input type="number" id="annOffset" value="3" min="0" max="20" step="1" />
            </div>
          </div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="interpolate" /> <label for="interpolate">Interpolate to Regular Interval</label>
        </div>
        <div class="field" id="interpIntervalWrap" style="display:none;">
          <label class="field-label" for="interpInterval">Interval</label>
          <select id="interpInterval">
            <option value="5min">5 min</option>
            <option value="10min">10 min</option>
            <option value="15min">15 min</option>
            <option value="30min">30 min</option>
            <option value="60min" selected>60 min (1 hr)</option>
            <option value="120min">120 min (2 hr)</option>
            <option value="360min">360 min (6 hr)</option>
            <option value="720min">720 min (12 hr)</option>
            <option value="1440min">1440 min (1 day)</option>
          </select>
        </div>
        <div class="row field">
          <div>
            <label class="field-label" for="figW">Width</label>
            <input type="number" id="figW" value="14" min="6" max="30" step="1" />
          </div>
          <div>
            <label class="field-label" for="figH">Height</label>
            <input type="number" id="figH" value="6" min="3" max="18" step="1" />
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="tickInterval">X-Axis Tick Interval</label>
          <select id="tickInterval">
            <option value="auto" selected>Auto</option>
            <option value="1">1 hour</option>
            <option value="2">2 hours</option>
            <option value="3">3 hours</option>
            <option value="6">6 hours</option>
            <option value="12">12 hours</option>
            <option value="24">1 day</option>
            <option value="48">2 days</option>
            <option value="168">1 week</option>
          </select>
        </div>
      </div>

      <!-- Export Options -->
      <div class="card" id="exportCard" style="opacity:.4;pointer-events:none;">
        <div class="card-title">5 &mdash; Export Options</div>
        <div class="row">
          <button class="btn" id="exportPngBtn"
            style="background:#228be6;color:white;font-size:0.82rem;padding:9px 0;">PNG</button>
          <button class="btn" id="exportPdfBtn"
            style="background:#e8590c;color:white;font-size:0.82rem;padding:9px 0;">PDF</button>
          <button class="btn" id="exportCsvBtn"
            style="background:#0ca678;color:white;font-size:0.82rem;padding:9px 0;">CSV</button>
        </div>
      </div>

      <!-- Plot Button -->
      <button class="btn btn-primary" id="plotBtn" disabled>Generate Plot</button>

    </aside>

    <!-- ─── Main ────────────────────────────────────────── -->
    <div class="main">
      <div class="plot-area">
        <div class="spinner" id="spinner"></div>
        <div id="plotContainer">
          <div class="plot-placeholder">
            <div class="ph-icon">📈</div>
            <p>Your plot will appear here</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let hasPlotted = false;

    // ── Helpers ──────────────────────────────────────────────
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 4000);
    }

    function enableCard(id) {
      const el = document.getElementById(id);
      el.style.opacity = "1";
      el.style.pointerEvents = "auto";
    }

    function disableCard(id) {
      const el = document.getElementById(id);
      el.style.opacity = ".4";
      el.style.pointerEvents = "none";
    }

    // ── Dropzone ─────────────────────────────────────────────
    const dz = document.getElementById("dropzone");
    const fi = document.getElementById("fileInput");

    dz.addEventListener("click", () => fi.click());
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
    dz.addEventListener("drop", e => {
      e.preventDefault();
      dz.classList.remove("dragover");
      if (e.dataTransfer.files.length) { fi.files = e.dataTransfer.files; fi.dispatchEvent(new Event("change")); }
    });

    fi.addEventListener("change", async () => {
      const file = fi.files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append("file", file);

      try {
        const res = await fetch("/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (data.error) { toast(data.error); return; }

        document.getElementById("fileName").textContent = data.filename;
        document.getElementById("fileRows").textContent = data.rows;
        document.getElementById("fileBadge").style.display = "flex";

        // Populate selects
        const xSel = document.getElementById("xCol");
        const ySel = document.getElementById("yCol");
        xSel.innerHTML = '<option value="">— select —</option>';
        ySel.innerHTML = '<option value="">— select —</option>';
        data.columns.forEach(c => {
          const sampleText = c.sample.slice(0, 2).join(", ");
          xSel.innerHTML += `<option value="${c.name}">${c.name}  (${sampleText}…)</option>`;
          ySel.innerHTML += `<option value="${c.name}">${c.name}  (${sampleText}…)</option>`;
        });

        enableCard("colCard");
        enableCard("optCard");
      } catch (e) { toast("Upload failed: " + e.message); }
    });

    // ── Column change → fetch range ──────────────────────────
    document.getElementById("xCol").addEventListener("change", async () => {
      const col = document.getElementById("xCol").value;
      if (!col) return;

      enableCard("rangeCard");

      try {
        const res = await fetch("/column_range", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ column: col }),
        });
        const d = await res.json();
        const hint = document.getElementById("rangeHint");
        const xMinEl = document.getElementById("xMin");
        const xMaxEl = document.getElementById("xMax");

        if (d.is_datetime) {
          xMinEl.type = "text";
          xMaxEl.type = "text";
          xMinEl.placeholder = "yyyy-mm-dd, HH:MM";
          xMaxEl.placeholder = "yyyy-mm-dd, HH:MM";

          const formatDT = (str) => {
            if (!str) return "";
            const parts = str.split(" ");
            if (parts.length >= 2) {
              return `${parts[0]}, ${parts[1].slice(0, 5)}`;
            }
            return str;
          };

          xMinEl.value = formatDT(d.min);
          xMaxEl.value = formatDT(d.max);
          hint.textContent = `Format: yyyy-mm-dd, HH:MM (Data: ${formatDT(d.min)} to ${formatDT(d.max)})`;
        } else {
          xMinEl.type = "text";
          xMaxEl.type = "text";
          xMinEl.placeholder = d.min || "auto";
          xMaxEl.placeholder = d.max || "auto";
          xMinEl.value = "";
          xMaxEl.value = "";
          hint.textContent = d.min ? `Range: ${d.min} to ${d.max}` : "";
        }
      } catch (_) { }

      checkReady();
    });
    document.getElementById("yCol").addEventListener("change", checkReady);

    function checkReady() {
      const ready = !!(document.getElementById("xCol").value && document.getElementById("yCol").value);
      document.getElementById("plotBtn").disabled = !ready;
      if (ready) {
        enableCard("exportCard");
      } else {
        disableCard("exportCard");
      }
    }

    // ── Show markers / annotations toggle ────────────────────
    function updateMarkerSizeVisibility() {
      const show = document.getElementById("showMarkers").checked || document.getElementById("showAnnotations").checked;
      const showAnn = document.getElementById("showAnnotations").checked;
      document.getElementById("markerSizeWrap").style.display = show ? "block" : "none";
      document.getElementById("specIdxWrap").style.display = show ? "block" : "none";
      document.getElementById("annConfigWrap").style.display = showAnn ? "block" : "none";
    }
    document.getElementById("showMarkers").addEventListener("change", updateMarkerSizeVisibility);
    document.getElementById("showAnnotations").addEventListener("change", updateMarkerSizeVisibility);

    // ── Interpolate toggle ───────────────────────────────────
    document.getElementById("interpolate").addEventListener("change", e => {
      document.getElementById("interpIntervalWrap").style.display = e.target.checked ? "block" : "none";
    });

    // ── Generate Plot ────────────────────────────────────────
    document.getElementById("plotBtn").addEventListener("click", async () => {
      const spinner = document.getElementById("spinner");
      const container = document.getElementById("plotContainer");
      spinner.style.display = "block";

      const payload = {
        x_col: document.getElementById("xCol").value,
        y_col: document.getElementById("yCol").value,
        x_min: document.getElementById("xMin").value || null,
        x_max: document.getElementById("xMax").value || null,
        title: document.getElementById("plotTitle").value,
        x_label: document.getElementById("xLabel").value,
        y_label: document.getElementById("yLabel").value,
        line_color: document.getElementById("lineColor").value,
        line_width: document.getElementById("lineWidth").value,
        show_grid: document.getElementById("showGrid").checked,
        show_legend: document.getElementById("showLegend").checked,
        show_markers: document.getElementById("showMarkers").checked,
        show_annotations: document.getElementById("showAnnotations").checked,
        marker_size: document.getElementById("markerSize").value,
        specified_indices: document.getElementById("specifiedIndices").value,
        ann_fontsize: document.getElementById("annFontsize").value,
        ann_offset: document.getElementById("annOffset").value,
        interpolate: document.getElementById("interpolate").checked,
        interp_interval: document.getElementById("interpInterval").value,
        tick_interval: document.getElementById("tickInterval").value,
        fig_width: document.getElementById("figW").value,
        fig_height: document.getElementById("figH").value,
      };

      try {
        const res = await fetch("/plot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        spinner.style.display = "none";

        if (data.error) { toast(data.error); return; }

        const iframe = document.createElement("iframe");
        iframe.className = "plot-interactive";
        iframe.style.width = "100%";
        iframe.style.height = (parseFloat(payload.fig_height) * 110 + 60) + "px";
        iframe.style.border = "none";
        iframe.style.borderRadius = "var(--radius)";
        iframe.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8">
        <style>
          body {
            margin: 0;
            padding: 10px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto;
          }
        </style>
      </head>
      <body>
        ${data.plot_html}
      </body>
      </html>
    `;
        container.innerHTML = "";
        container.appendChild(iframe);
        hasPlotted = true;
      } catch (e) {
        spinner.style.display = "none";
        toast("Plot failed: " + e.message);
      }
    });

    // ── Export handlers ──────────────────────────────────────
    async function triggerExport(format) {
      const payload = {
        x_col: document.getElementById("xCol").value,
        y_col: document.getElementById("yCol").value,
        x_min: document.getElementById("xMin").value || null,
        x_max: document.getElementById("xMax").value || null,
        title: document.getElementById("plotTitle").value,
        x_label: document.getElementById("xLabel").value,
        y_label: document.getElementById("yLabel").value,
        line_color: document.getElementById("lineColor").value,
        line_width: document.getElementById("lineWidth").value,
        show_grid: document.getElementById("showGrid").checked,
        show_legend: document.getElementById("showLegend").checked,
        show_markers: document.getElementById("showMarkers").checked,
        show_annotations: document.getElementById("showAnnotations").checked,
        marker_size: document.getElementById("markerSize").value,
        specified_indices: document.getElementById("specifiedIndices").value,
        ann_fontsize: document.getElementById("annFontsize").value,
        ann_offset: document.getElementById("annOffset").value,
        interpolate: document.getElementById("interpolate").checked,
        interp_interval: document.getElementById("interpInterval").value,
        tick_interval: document.getElementById("tickInterval").value,
        fig_width: document.getElementById("figW").value,
        fig_height: document.getElementById("figH").value,
        format: format
      };

      try {
        toast(`Preparing ${format.toUpperCase()} export...`);
        const res = await fetch("/export", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.error) { toast(data.error); return; }

        const link = document.createElement("a");
        link.href = `data:${data.mimetype};base64,${data.data}`;
        link.download = data.filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        toast(`${format.toUpperCase()} downloaded successfully!`);
      } catch (e) {
        toast("Export failed: " + e.message);
      }
    }

    document.getElementById("exportPngBtn").addEventListener("click", () => triggerExport("png"));
    document.getElementById("exportPdfBtn").addEventListener("click", () => triggerExport("pdf"));
    document.getElementById("exportCsvBtn").addEventListener("click", () => triggerExport("csv"));

    // ── Auto-Update plot on parameter change if already plotted ───────────
    const autoUpdateInputs = [
      "xCol", "yCol", "xMin", "xMax", "plotTitle", "xLabel", "yLabel",
      "lineColor", "lineWidth", "showGrid", "showLegend", "showMarkers", "showAnnotations",
      "markerSize", "specifiedIndices", "annFontsize", "annOffset",
      "interpolate", "interpInterval", "figW", "figH", "tickInterval"
    ];

    autoUpdateInputs.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("change", () => {
          if (hasPlotted && !document.getElementById("plotBtn").disabled) {
            document.getElementById("plotBtn").click();
          }
        });
      }
    });
  </script>

</body>

</html>
